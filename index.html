<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MildTask</title>
  <meta name="description" content="จัดการงาน ตารางงาน To-do list และรายรับรายจ่ายส่วนตัว" data-i18n-attr="content:meta.description" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
  <script>
    // ตั้งธีมก่อนหน้าเว็บแสดง เพื่อไม่ให้กระพริบ
    try {
      const t = JSON.parse(localStorage.getItem('mytodo.prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (JSON.parse(localStorage.getItem('mytodo.prefs') || '{}').lang === 'en') document.documentElement.lang = 'en';
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5" /></svg>
      </span>
      <span>MildTask</span>
    </div>

    <nav class="tabs" aria-label="มุมมอง" data-i18n-attr="aria-label:nav.label">
      <button class="tab" data-view="dashboard" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" /></svg>
        <span data-i18n="view.dashboard">ภาพรวม</span>
      </button>
      <button class="tab" data-view="events" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6" /></svg>
        <span data-i18n="view.events">กิจกรรม</span>
      </button>
      <button class="tab" data-view="list" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" /></svg>
        <span data-i18n="view.list">รายการงาน</span>
      </button>
      <button class="tab" data-view="calendar" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 10h16M8 3v4M16 3v4" /></svg>
        <span data-i18n="view.calendar">ตารางงาน</span>
      </button>
      <button class="tab" data-view="money" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 9h16M16 14h1" /></svg>
        <span data-i18n="view.money">การเงิน</span>
      </button>
    </nav>

    <div class="top-actions">
      <button class="btn btn-primary requires-auth" type="button" data-action="add" title="เพิ่มงาน (N) · เพิ่มกิจกรรม (E)" data-i18n-attr="title:add.hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span class="btn-label" data-i18n="add">เพิ่ม</span>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" type="button" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="เมนู" data-i18n-attr="aria-label:menu">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor; stroke: none"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <div class="menu-section" id="account"></div>
          <div class="menu-section">
            <div class="menu-label" data-i18n="theme">ธีม</div>
            <div class="segmented" role="group" aria-label="ธีม" data-i18n-attr="aria-label:theme">
              <button type="button" data-action="theme" data-theme-value="auto" data-i18n="theme.auto">อัตโนมัติ</button>
              <button type="button" data-action="theme" data-theme-value="light" data-i18n="theme.light">สว่าง</button>
              <button type="button" data-action="theme" data-theme-value="dark" data-i18n="theme.dark">มืด</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-label" data-i18n="language">ภาษา</div>
            <div class="segmented" role="group" aria-label="ภาษา" data-i18n-attr="aria-label:language">
              <button type="button" data-action="lang" data-lang-value="th" lang="th">ไทย</button>
              <button type="button" data-action="lang" data-lang-value="en" lang="en">English</button>
            </div>
          </div>
          <div class="menu-section requires-auth">
            <div class="menu-label" data-i18n="backup">สำรองข้อมูล</div>
            <button class="menu-item" type="button" data-action="export" data-i18n="export">ส่งออกไฟล์ JSON</button>
            <button class="menu-item" type="button" data-action="import" data-i18n="import">นำเข้าไฟล์ JSON</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="banner"></div>
  <main id="view" class="view" tabindex="-1"></main>

  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" novalidate>
      <header class="dialog-head">
        <h2 id="task-dialog-title"></h2>
        <button class="icon-btn" type="button" data-action="close-dialog" aria-label="ปิด" data-i18n-attr="aria-label:close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <div class="segmented type-picker" role="radiogroup" aria-label="ประเภท" data-i18n-attr="aria-label:type">
        <label><input type="radio" name="type" value="task" /><span data-i18n="type.task">งาน (To-do)</span></label>
        <label><input type="radio" name="type" value="event" /><span data-i18n="type.event">กิจกรรม / นัดหมาย</span></label>
      </div>

      <label class="field">
        <span class="task-only" data-i18n="f.taskTitle">ชื่องาน</span>
        <span class="event-only" data-i18n="f.eventTitle">ชื่อกิจกรรม</span>
        <input name="title" type="text" maxlength="200" required autocomplete="off" />
        <small class="field-error" hidden data-i18n="f.titleRequired">กรุณาใส่ชื่อ</small>
      </label>

      <label class="field">
        <span data-i18n="f.description">รายละเอียด</span>
        <textarea name="description" rows="3" maxlength="5000" placeholder="โน้ตเพิ่มเติม (ไม่ใส่ก็ได้)" data-i18n-attr="placeholder:f.descPh"></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="task-only" data-i18n="f.dueDate">วันครบกำหนด</span>
          <span class="event-only" data-i18n="f.date">วันที่</span>
          <input name="dueDate" type="date" />
          <small class="field-error date-error" hidden data-i18n="f.dateRequired">กรุณาเลือกวันที่</small>
        </label>
        <label class="field">
          <span class="task-only" data-i18n="f.time">เวลา</span>
          <span class="event-only" data-i18n="f.start">เริ่ม</span>
          <input name="dueTime" type="time" />
        </label>
      </div>

      <div class="field-row event-only">
        <label class="field">
          <span data-i18n="f.location">สถานที่</span>
          <input name="location" type="text" maxlength="200" autocomplete="off" placeholder="ไม่ใส่ก็ได้" data-i18n-attr="placeholder:f.optional" />
        </label>
        <label class="field">
          <span data-i18n="f.end">สิ้นสุด</span>
          <input name="endTime" type="time" />
        </label>
      </div>

      <fieldset class="field task-only">
        <legend data-i18n="f.priority">ความสำคัญ</legend>
        <div class="segmented prio-picker">
          <label><input type="radio" name="priority" value="high" /><span class="prio-high" data-i18n="prio.high">สูง</span></label>
          <label><input type="radio" name="priority" value="medium" /><span class="prio-medium" data-i18n="prio.medium">กลาง</span></label>
          <label><input type="radio" name="priority" value="low" /><span class="prio-low" data-i18n="prio.low">ต่ำ</span></label>
        </div>
      </fieldset>

      <fieldset class="field event-only">
        <legend data-i18n="f.category">ประเภทกิจกรรม</legend>
        <div class="segmented cat-picker">
          <label><input type="radio" name="category" value="meeting" /><span class="cat-meeting" data-i18n="cat.meeting">ประชุม</span></label>
          <label><input type="radio" name="category" value="appointment" /><span class="cat-appointment" data-i18n="cat.appointment">นัดหมาย</span></label>
          <label><input type="radio" name="category" value="personal" /><span class="cat-personal" data-i18n="cat.personal">ส่วนตัว</span></label>
          <label><input type="radio" name="category" value="travel" /><span class="cat-travel" data-i18n="cat.travel">เดินทาง</span></label>
          <label><input type="radio" name="category" value="other" /><span class="cat-other" data-i18n="cat.other">อื่นๆ</span></label>
        </div>
      </fieldset>

      <label class="field">
        <span data-i18n="f.tags">แท็ก</span>
        <input name="tags" type="text" list="tag-options" autocomplete="off" placeholder="เช่น งาน, บ้าน (คั่นด้วยจุลภาค)" data-i18n-attr="placeholder:f.tagsPh" />
        <datalist id="tag-options"></datalist>
      </label>

      <label class="check-field edit-only task-only">
        <input name="done" type="checkbox" />
        <span data-i18n="f.done">ทำเสร็จแล้ว</span>
      </label>

      <footer class="dialog-foot">
        <button class="btn btn-danger-ghost edit-only" type="button" data-action="delete-from-dialog" data-i18n="delete">ลบ</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-action="close-dialog" data-i18n="cancel">ยกเลิก</button>
        <button class="btn btn-primary" type="submit" data-i18n="save">บันทึก</button>
      </footer>
    </form>
  </dialog>

  <dialog id="money-dialog" aria-labelledby="money-dialog-title">
    <form id="money-form" novalidate>
      <header class="dialog-head">
        <h2 id="money-dialog-title"></h2>
        <button class="icon-btn" type="button" data-action="close-money" aria-label="ปิด" data-i18n-attr="aria-label:close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>

      <div class="slip-box" hidden>
        <img class="slip-img" alt="" />
        <div class="slip-info">
          <p class="slip-status"><span class="spinner"></span><span class="slip-msg"></span></p>
          <p class="slip-dup" hidden></p>
          <p class="slip-note" data-i18n="slip.private">รูปสลิปใช้อ่านในเครื่องนี้เท่านั้น ไม่ถูกอัปโหลดหรือบันทึก</p>
        </div>
      </div>
      <input type="hidden" name="ref" />

      <div class="segmented type-picker money-type" role="radiogroup" aria-label="ประเภท" data-i18n-attr="aria-label:type">
        <label><input type="radio" name="type" value="expense" /><span class="is-expense" data-i18n="type.expense">รายจ่าย</span></label>
        <label><input type="radio" name="type" value="income" /><span class="is-income" data-i18n="type.income">รายรับ</span></label>
      </div>

      <label class="field">
        <span data-i18n="f.amount">จำนวนเงิน (บาท)</span>
        <input name="amount" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" />
        <small class="field-error amount-error" hidden data-i18n="f.amountRequired">กรุณาใส่จำนวนเงินมากกว่า 0</small>
      </label>

      <label class="field">
        <span data-i18n="f.item">รายการ</span>
        <input name="title" type="text" maxlength="200" autocomplete="off" />
      </label>

      <fieldset class="field">
        <legend data-i18n="f.moneyCategory">หมวด</legend>
        <div class="segmented cat-picker" id="money-cats"></div>
      </fieldset>

      <div class="field-row">
        <label class="field">
          <span data-i18n="f.date">วันที่</span>
          <input name="dueDate" type="date" />
        </label>
        <label class="field">
          <span data-i18n="f.tags">แท็ก</span>
          <input name="tags" type="text" list="money-tag-options" autocomplete="off" placeholder="ไม่ใส่ก็ได้" data-i18n-attr="placeholder:f.optional" />
          <datalist id="money-tag-options"></datalist>
        </label>
      </div>

      <label class="field">
        <span data-i18n="f.description">รายละเอียด</span>
        <textarea name="description" rows="2" maxlength="5000" placeholder="โน้ตเพิ่มเติม (ไม่ใส่ก็ได้)" data-i18n-attr="placeholder:f.descPh"></textarea>
      </label>

      <footer class="dialog-foot">
        <button class="btn btn-danger-ghost edit-only" type="button" data-action="delete-money" data-i18n="delete">ลบ</button>
        <span class="spacer"></span>
        <button class="btn" type="button" data-action="close-money" data-i18n="cancel">ยกเลิก</button>
        <button class="btn btn-primary" type="submit" data-i18n="save">บันทึก</button>
      </footer>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <input type="file" id="slip-file" accept="image/*" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
